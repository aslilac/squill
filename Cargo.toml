[workspace]
resolver = "3"
members = [
	"crates/cli/",
	"crates/corpus-report/",
	"crates/embed/",
	"crates/formatter/",
	"crates/parser/",
	"crates/playground/",
]
exclude = ["crates/parser/fuzz/", "crates/embed/tests/fixtures/sqlx_app/"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
embed = { path = "crates/embed/" }
formatter = { path = "crates/formatter/" }
parser = { path = "crates/parser/" }
cstree = { version = "0.12", features = ["derive"] }
insta = "1"

# The docs-playground wasm module: small and slow-to-build is the right
# trade for a binary users download.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
strip = true
codegen-units = 1
