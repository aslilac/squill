[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["wasm"]
# Load tree-sitter grammars compiled to wasm (`grammar = "x.wasm"`).
# Pulls in wasmtime, whose build needs cmake.
wasm = ["embed/wasm"]

[dependencies]
embed = { workspace = true, features = ["cpp", "csharp", "java", "kotlin"] }
parser.workspace = true
formatter.workspace = true
globset = "0.4"
ignore = "0.4"
rayon = "1.12.0"
similar = "3.1.1"
toml = { version = "0.9", default-features = false, features = ["parse"] }
dialoguer = { version = "0.12.0", default-features = false }

[[bin]]
name = "squill"
path = "src/main.rs"
