[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = [
	"external-grammars",
	"lsp",
	"rust", "go", "python", "javascript", "typescript", "gleam",
	"cpp", "csharp", "java", "kotlin",
]
# Load tree-sitter grammars compiled to wasm (`grammar = "x.wasm"`).
# Pulls in wasmtime, whose build needs cmake.
external-grammars = ["embed/external-grammars"]
# `squill lsp`, a language server for editors.
lsp = ["dep:lsp-server", "dep:lsp-types", "dep:serde_json"]
# The built-in grammars, one feature each: build with
# `--no-default-features --features rust,go` for just those.
rust = ["embed/rust"]
go = ["embed/go"]
python = ["embed/python"]
javascript = ["embed/javascript"]
typescript = ["embed/typescript"]
gleam = ["embed/gleam"]
cpp = ["embed/cpp"]
csharp = ["embed/csharp"]
java = ["embed/java"]
kotlin = ["embed/kotlin"]

[dependencies]
embed.workspace = true
parser.workspace = true
formatter.workspace = true
globset = "0.4"
ignore = "0.4"
rayon = "1.12.0"
similar = "3.1.1"
toml = { version = "0.9", default-features = false, features = ["parse"] }
dialoguer = { version = "0.12.0", default-features = false }
lsp-server = { version = "0.10", optional = true }
lsp-types = { version = "0.97", optional = true }
serde_json = { version = "1.0.151", optional = true }

[[bin]]
name = "squill"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1.0.151"
