[package]
name = "embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# One feature per built-in grammar, so a size-sensitive build (the
# playground, or anyone after a tiny binary) carries only what it needs.
default = [
	"rust", "go", "python", "javascript", "typescript", "gleam",
	"cpp", "csharp", "java", "kotlin",
]
rust = ["dep:tree-sitter-rust"]
go = ["dep:tree-sitter-go"]
python = ["dep:tree-sitter-python"]
javascript = ["dep:tree-sitter-javascript"]
# TypeScript and TSX: one crate, two grammars.
typescript = ["dep:tree-sitter-typescript"]
gleam = ["dep:tree-sitter-gleam"]
cpp = ["dep:tree-sitter-cpp"]
csharp = ["dep:tree-sitter-c-sharp"]
java = ["dep:tree-sitter-java"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
# Load tree-sitter grammars compiled to wasm at runtime (pulls in
# wasmtime). Off for the playground, which is itself wasm.
wasm = ["tree-sitter/wasm"]

[dependencies]
formatter = { workspace = true }
parser = { workspace = true }
streaming-iterator = "0.1.9"
tree-sitter = "0.26.11"
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-gleam = { version = "1.0.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[[example]]
name = "demo_embed"
required-features = ["rust"]

[[example]]
name = "query_debug"
required-features = ["gleam"]

[[example]]
name = "sexp_dump"
required-features = ["python"]
