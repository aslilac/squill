name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    name: Verify

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - run: |
          version="v$(cat Cargo.toml | grep -m 1 "version" | sed -r "s/version *= *\"([[:digit:].]+)\"/\1/")"
          if [ "$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match version $version in Cargo.toml"
            exit 1
          fi
          # The editor extensions ship with each release, at its version.
          vscode="v$(node -p 'require("./integrations/vscode/package.json").version')"
          zed="v$(grep -m 1 '^version' integrations/zed/extension.toml | sed -r 's/version *= *"([[:digit:].]+)"/\1/')"
          for pair in "integrations/vscode/package.json:$vscode" "integrations/zed/extension.toml:$zed"; do
            if [ "${pair#*:}" != "${{ github.ref_name }}" ]; then
              echo "tag ${{ github.ref_name }} does not match version ${pair#*:} in ${pair%%:*}"
              exit 1
            fi
          done
        name: Verify version

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust

      - run: cargo test
        name: Test

      - uses: softprops/action-gh-release@v3
        name: Release

  package:
    strategy:
      fail-fast: false
      matrix:
        release:
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            vscode: linux-arm64
            executable: squill

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            vscode: linux-x64
            executable: squill

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            vscode: win32-arm64
            executable: squill.exe

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vscode: win32-x64
            executable: squill.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            vscode: darwin-arm64
            executable: squill

    name: Package.${{ matrix.release.target }}

    runs-on: ${{ matrix.release.os }}

    needs:
      - publish

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust
        with:
          target: ${{ matrix.release.target }}

      - run: cargo build --target ${{ matrix.release.target }} --release
        name: Build

      - run: mkdir dist/
        name: Prepare for packaging

      # Create .tar.gz files for Linux and macOS
      - run: tar -a -cf ../../../dist/squill-${{ github.ref_name }}-${{ matrix.release.target }}.tar.gz ${{ matrix.release.executable }}
        name: Package (tar) — ${{ matrix.release.target }}
        working-directory: ./target/${{ matrix.release.target }}/release/
        if: ${{ !startsWith(matrix.release.os, 'windows') }}

      # Create .zip files for Windows
      - run: Compress-Archive ${{ matrix.release.executable }} -DestinationPath ../../../dist/squill-${{ github.ref_name }}-${{ matrix.release.target }}.zip
        name: Package (zip) — ${{ matrix.release.target }}
        working-directory: ./target/${{ matrix.release.target }}/release/
        if: ${{ startsWith(matrix.release.os, 'windows') }}

      # The VS Code extension for this platform, with this squill in its
      # bin/: the extension falls back to it when squill isn't on PATH.
      - uses: pnpm/setup@v3
        name: Configure pnpm
        with:
          runtime: node@24

      - run: |
          mkdir -p integrations/vscode/bin
          cp target/${{ matrix.release.target }}/release/${{ matrix.release.executable }} integrations/vscode/bin/
          cd integrations/vscode
          pnpm run build
          pnpm exec vsce package --no-dependencies --target ${{ matrix.release.vscode }} --out ../../dist/squill-${{ github.ref_name }}-${{ matrix.release.vscode }}.vsix
        name: Package (VS Code) — ${{ matrix.release.vscode }}
        shell: bash

      # Upload archives to a Github release for this version
      - uses: softprops/action-gh-release@v3
        name: Publish
        with:
          files: |
            ./dist/squill-${{ github.ref_name }}-${{ matrix.release.target }}.*
            ./dist/squill-${{ github.ref_name }}-${{ matrix.release.vscode }}.vsix
