name: Check

on:
  push:
    branches: ["trunk"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: Conformance

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: crate-ci/typos@v1
        name: Spellcheck

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust

      - run: cargo fmt --check
        name: Format

      - uses: actions/cache@v6
        name: Configure cache
        with:
          path: |
            ~/.cargo/git/
            ~/.cargo/registry/
            target/
          key: cargo-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ github.workflow }}-${{ github.job }}-

      - run: cargo clippy
        name: Lint

      - run: cargo test
        name: Test

  zed:
    name: Zed extension

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: dtolnay/rust-toolchain@stable
        name: Configure Rust
        with:
          targets: wasm32-wasip2

      - run: cargo clippy --manifest-path integrations/zed/Cargo.toml --target wasm32-wasip2 -- -D warnings
        name: Lint

      - run: cargo build --manifest-path integrations/zed/Cargo.toml --target wasm32-wasip2 --release
        name: Build
