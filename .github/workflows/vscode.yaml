name: Package VS Code extension

# Run by hand when the extension changes. One package for every
# platform: the extension downloads squill itself when it isn't
# installed. The package is left as a workflow artifact to publish.
on:
  workflow_dispatch:

jobs:
  package:
    name: Package

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - uses: pnpm/setup@v3
        name: Configure pnpm
        with:
          runtime: node@24
          cache: true

      - run: |
          mkdir -p dist
          cd integrations/vscode
          pnpm run build
          pnpm run package --out ../../dist/
        name: Package

      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: squill-vscode
          path: dist/*.vsix
