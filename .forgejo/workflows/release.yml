name: release

# Tag `vX.Y.Z` -> build a static x86_64 linux binary and attach it to
# the Forgejo release, so CI elsewhere can curl it instead of building
# from source.

on:
  push:
    tags: [v*]

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      # crt-static on the stock gnu target: fully static without needing
      # apt (musl-tools) or rustup target installs on the runner.
      - run: cargo build --release --target x86_64-unknown-linux-gnu -p cli
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: stage release assets
        run: |
          mkdir release
          cp target/x86_64-unknown-linux-gnu/release/squill \
            release/squill-x86_64-linux
      - uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          tag: ${{ github.ref_name }}
          release-dir: release
          token: ${{ secrets.GITHUB_TOKEN }}
